# Shared security headers. nginx drops every inherited add_header as soon as a
# location sets one of its own, so this file is included in the server block AND
# in each location that adds a header — include it, never re-type the policy.
#
# The production Vite build emits only external hashed module scripts (no inline
# <script>), so script-src 'self' holds; style-src keeps 'unsafe-inline' because
# the SPA injects runtime styles. API and WS are proxied same-origin (/api, /ws).
# The extension catalog is a static document on GitHub Pages, so connect-src has
# to name that origin explicitly — the desktop shell already allows https:.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' ws: wss: https://haowei2000.github.io; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
