<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/cheers-icon.svg" />
    <!-- viewport-fit=cover: extend under notches/home indicator (we pad with
         env(safe-area-inset-*)); interactive-widget=resizes-content: the on-screen
         keyboard shrinks the layout viewport so the composer stays visible. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#09090b" />
    <script>
      (() => {
        const key = "cheers.theme";
        let preference = "system";
        try {
          const stored = localStorage.getItem(key);
          if (stored === "light" || stored === "dark" || stored === "system") preference = stored;
        } catch (_) {}
        const resolved = preference === "system"
          ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : preference;
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = resolved;
        document.querySelector('meta[name="theme-color"]').content = resolved === "dark" ? "#09090b" : "#f8f8fa";
      })();
    </script>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Cheers</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
