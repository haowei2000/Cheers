name: release-connector

# Publish prebuilt `cce-acp-connector` binaries so non-developers can onboard an
# agent without a Rust toolchain (install.sh downloads these). Trigger by pushing a
# tag like `connector-v0.1.22`, or run manually.
#
# Linux assets are MUSL-STATIC on purpose: a gnu build inherits the runner's glibc
# (ubuntu-latest = 24.04 → GLIBC_2.39), which refuses to run on the older distros
# real bot hosts use (seen in the wild: Ubuntu 22.04 / glibc 2.35 → the binary
# downloads fine, then crash-loops). Static musl runs on any distro. The linux
# targets build via `cross` (docker images with the musl toolchains, handles
# ring's C code); macOS keeps plain cargo.
on:
  push:
    tags: ["connector-v*"]
  workflow_dispatch: {}

permissions:
  contents: write # create the release + upload assets

jobs:
  build:
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one target failing must not block the others
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            asset: cce-acp-connector-darwin-arm64
          # Intel macOS is cross-compiled from the arm64 runner: GitHub retired
          # the macos-13 (Intel) runner pool, so an x86_64 job queues forever.
          - os: macos-14
            target: x86_64-apple-darwin
            asset: cce-acp-connector-darwin-amd64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: cce-acp-connector-linux-amd64
            use_cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset: cce-acp-connector-linux-arm64
            use_cross: true
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust + target
        run: |
          rustup update stable --no-self-update
          rustup target add ${{ matrix.target }}

      - name: Cache Rust release artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/cheers-acp-connector-rs
          shared-key: connector-release-${{ matrix.target }}
          cache-on-failure: true

      - name: Install cross (Linux musl builds)
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        working-directory: packages/cheers-acp-connector-rs
        run: ${{ matrix.use_cross && 'cross' || 'cargo' }} build --release --locked --bin cce-acp-connector --target ${{ matrix.target }}

      # Guard the reason these are musl: a dynamically-linked linux asset would
      # reintroduce the glibc-version trap this workflow exists to avoid.
      - name: Verify static + runnable (Linux)
        if: matrix.use_cross
        run: |
          for bin in \
            "packages/cheers-acp-connector-rs/target/${{ matrix.target }}/release/cce-acp-connector"; do
            file "$bin"
            file "$bin" | grep -Eq "statically linked|static-pie linked" || { echo "::error::$bin is not statically linked"; exit 1; }
          done
          # amd64 runner can execute the amd64 binary — real smoke test.
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            "packages/cheers-acp-connector-rs/target/${{ matrix.target }}/release/cce-acp-connector" --help >/dev/null
          fi

      - name: Stage asset
        run: cp "packages/cheers-acp-connector-rs/target/${{ matrix.target }}/release/cce-acp-connector" "${{ matrix.asset }}"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}
          # On tag pushes this creates/updates the release for the tag; each matrix
          # job appends its binaries to the same release.
          # Keep this false: desktop auto-update reads
          # releases/latest/download/latest.json, and a connector release must
          # not steal GitHub's "latest" pointer from the desktop feed.
          make_latest: false
          fail_on_unmatched_files: true

  # Signed update manifest for the connector's opt-in self-updater ([update]
  # auto = true). Runs after every binary is attached: downloads them back from
  # the release, records their sha256 in connector-manifest.json, and signs the
  # manifest bytes with the CONNECTOR_SIGNING_KEY ed25519 secret (the matching
  # public key ships inside the connector at
  # packages/cheers-acp-connector-rs/release-signing-pubkey.pem). A connector
  # only swaps binaries whose hash appears in a manifest that verifies against
  # that pinned key — a compromised gateway or GitHub proxy can't push code.
  manifest:
    name: sign update manifest
    needs: build
    if: startsWith(github.ref, 'refs/tags/connector-v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download release assets
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=${tag#connector-v}" >> "$GITHUB_ENV"
          mkdir assets
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir assets \
            --pattern 'cce-acp-connector-*'
          ls -l assets

      - name: Build + sign manifest
        env:
          CONNECTOR_SIGNING_KEY: ${{ secrets.CONNECTOR_SIGNING_KEY }}
        run: |
          if [ -z "$CONNECTOR_SIGNING_KEY" ]; then
            echo "::error::CONNECTOR_SIGNING_KEY secret is not set — cannot publish a signed" \
                 "update manifest. Self-updating connectors will not pick up this release." \
                 "Add the ed25519 private key (PEM) as a repo secret and re-run this job."
            exit 1
          fi
          python3 - << 'EOF'
          import hashlib, json, os, pathlib
          assets = {
              p.name: {"sha256": hashlib.sha256(p.read_bytes()).hexdigest()}
              for p in sorted(pathlib.Path("assets").iterdir())
          }
          manifest = {"version": os.environ["VERSION"], "assets": assets}
          pathlib.Path("connector-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n"
          )
          EOF
          printf '%s' "$CONNECTOR_SIGNING_KEY" > signing-key.pem
          openssl pkeyutl -sign -inkey signing-key.pem -rawin \
            -in connector-manifest.json -out manifest.sig.bin
          base64 -w0 manifest.sig.bin > connector-manifest.json.sig
          rm -f signing-key.pem manifest.sig.bin
          cat connector-manifest.json

      - name: Attach manifest to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            connector-manifest.json
            connector-manifest.json.sig
          make_latest: false
          fail_on_unmatched_files: true

  # Sync the gateway's CHEERS_CONNECTOR_RELEASE_VERSION pin to this tag. The
  # pin is what the download proxy serves and what self-updating connectors
  # target; leaving it as a manual, outside-repo step is exactly how the #538
  # incident happened (new-schema config + stale 0.1.36 binary → installs
  # crash-looped; the gateway now refuses below the config-schema floor, see
  # MIN_CONNECTOR_VERSION in server/src/api/pairing.rs). Must run only after
  # `manifest` succeeded: the pin is the update signal, and auto-update
  # requires the signed manifest. Payload construction mirrors the deploy job
  # in cd.yml — keep the two in step.
  sync-pin:
    name: sync gateway release pin
    needs: manifest
    if: |
      startsWith(github.ref, 'refs/tags/connector-v') &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Sync pin via SSH deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ vars.APPLE_KEY_ID }}
          APPLE_CLIENT_ID: ${{ vars.APPLE_CLIENT_ID }}
          APPLE_PRIVATE_KEY_P8: ${{ secrets.APPLE_PRIVATE_KEY_P8 }}
          APPLE_WEB_CLIENT_ID: ${{ vars.APPLE_WEB_CLIENT_ID }}
          APPLE_WEB_REDIRECT_URI: ${{ vars.APPLE_WEB_REDIRECT_URI }}
          GATEWAY_IMAGE: ghcr.io/${{ github.repository_owner }}/cheers-gateway:main
          FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cheers-frontend:main
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_SECRET: ${{ secrets.GOOGLE_WEB_CLIENT_SECRET }}
          GOOGLE_WEB_REDIRECT_URI: ${{ vars.GOOGLE_WEB_REDIRECT_URI }}
          GITHUB_OAUTH_CLIENT_ID: ${{ vars.CHEERS_GITHUB_OAUTH_CLIENT_ID }}
          GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.CHEERS_GITHUB_OAUTH_CLIENT_SECRET }}
          GITHUB_OAUTH_REDIRECT_URI: ${{ vars.CHEERS_GITHUB_OAUTH_REDIRECT_URI }}
          GITHUB_APP_ID: ${{ vars.CHEERS_GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.CHEERS_GITHUB_APP_PRIVATE_KEY }}
          OAUTH_WEB_RETURN_URL: ${{ vars.OAUTH_WEB_RETURN_URL }}
          CONNECTOR_VERSION: ${{ github.ref_name }}
        run: |
          set +x
          VERSION="${CONNECTOR_VERSION#connector-v}"
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag $CONNECTOR_VERSION is not connector-v<major.minor.patch>" >&2; exit 1 ;;
          esac

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

          for name in \
            APPLE_TEAM_ID \
            APPLE_KEY_ID \
            APPLE_CLIENT_ID \
            APPLE_PRIVATE_KEY_P8 \
            APPLE_WEB_CLIENT_ID \
            APPLE_WEB_REDIRECT_URI \
            OAUTH_WEB_RETURN_URL
          do
            if [ -z "${!name:-}" ]; then
              echo "required production auth setting is missing: $name" >&2
              exit 1
            fi
          done

          google_count=0
          for name in GOOGLE_WEB_CLIENT_ID GOOGLE_WEB_CLIENT_SECRET GOOGLE_WEB_REDIRECT_URI; do
            if [ -n "${!name:-}" ]; then
              google_count=$((google_count + 1))
            fi
          done
          if [ "$google_count" -ne 0 ] && [ "$google_count" -ne 3 ]; then
            echo "Google OAuth settings must be configured together" >&2
            exit 1
          fi
          github_oauth_count=0
          for name in GITHUB_OAUTH_CLIENT_ID GITHUB_OAUTH_CLIENT_SECRET GITHUB_OAUTH_REDIRECT_URI; do
            if [ -n "${!name:-}" ]; then github_oauth_count=$((github_oauth_count + 1)); fi
          done
          github_app_count=0
          for name in GITHUB_APP_ID GITHUB_APP_PRIVATE_KEY; do
            if [ -n "${!name:-}" ]; then github_app_count=$((github_app_count + 1)); fi
          done
          if [ "$github_oauth_count" -ne 0 ] && [ "$github_oauth_count" -ne 3 ]; then echo "GitHub OAuth settings must be configured together" >&2; exit 1; fi
          if [ "$github_app_count" -ne 0 ] && [ "$github_app_count" -ne 2 ]; then echo "GitHub App settings must be configured together" >&2; exit 1; fi

          payload="$(mktemp)"
          trap 'rm -f "$payload"' EXIT
          chmod 600 "$payload"
          printf '%s\n' 'CHEERS_DEPLOY_AUTH_ENV_V1' > "$payload"

          append_payload_field() {
            name="$1"
            value="$2"
            encoded="$(printf '%s' "$value" | base64 | tr -d '\n')"
            printf '%s=%s\n' "$name" "$encoded" >> "$payload"
          }

          append_payload_field APPLE_TEAM_ID "$APPLE_TEAM_ID"
          append_payload_field APPLE_KEY_ID "$APPLE_KEY_ID"
          append_payload_field APPLE_CLIENT_ID "$APPLE_CLIENT_ID"
          append_payload_field APPLE_PRIVATE_KEY_P8 "$APPLE_PRIVATE_KEY_P8"
          append_payload_field APPLE_WEB_CLIENT_ID "$APPLE_WEB_CLIENT_ID"
          append_payload_field APPLE_WEB_REDIRECT_URI "$APPLE_WEB_REDIRECT_URI"
          append_payload_field GATEWAY_IMAGE "$GATEWAY_IMAGE"
          append_payload_field FRONTEND_IMAGE "$FRONTEND_IMAGE"
          if [ "$google_count" -eq 3 ]; then
            append_payload_field GOOGLE_WEB_CLIENT_ID "$GOOGLE_WEB_CLIENT_ID"
            append_payload_field GOOGLE_WEB_CLIENT_SECRET "$GOOGLE_WEB_CLIENT_SECRET"
            append_payload_field GOOGLE_WEB_REDIRECT_URI "$GOOGLE_WEB_REDIRECT_URI"
          fi
          if [ "$github_oauth_count" -eq 3 ]; then
            append_payload_field GITHUB_OAUTH_CLIENT_ID "$GITHUB_OAUTH_CLIENT_ID"
            append_payload_field GITHUB_OAUTH_CLIENT_SECRET "$GITHUB_OAUTH_CLIENT_SECRET"
            append_payload_field GITHUB_OAUTH_REDIRECT_URI "$GITHUB_OAUTH_REDIRECT_URI"
          fi
          if [ "$github_app_count" -eq 2 ]; then
            append_payload_field GITHUB_APP_ID "$GITHUB_APP_ID"
            append_payload_field GITHUB_APP_PRIVATE_KEY "$GITHUB_APP_PRIVATE_KEY"
          fi
          append_payload_field OAUTH_WEB_RETURN_URL "$OAUTH_WEB_RETURN_URL"
          append_payload_field CHEERS_CONNECTOR_RELEASE_VERSION "$VERSION"

          # Forced-command key on the server: the requested command is
          # ignored, and the fixed deploy script accepts only the versioned,
          # allowlisted payload on stdin.
          ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              "$USER@$HOST" deploy < "$payload"
