name: Deploy Pages

# Publishes the static landing page in website/ to GitHub Pages.
# Requires: repo Settings → Pages → Source = "GitHub Actions" (enabled once).
# Note: Pages on a PRIVATE repo needs a paid plan; on a public repo it is free.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "extensions/**"
      - "packages/cheers-workbench-sdk/**"
      - "scripts/build-extension-catalog.mjs"
      - "scripts/lib/extension-catalog.test.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/cheers-workbench-sdk/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build and verify extension catalog
        run: |
          npm --prefix packages/cheers-workbench-sdk ci
          npm --prefix packages/cheers-workbench-sdk run build
          node --test scripts/lib/extension-catalog.test.mjs
          cp -R website _site
          node scripts/build-extension-catalog.mjs --website-dir _site

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
