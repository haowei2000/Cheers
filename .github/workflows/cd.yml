name: CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_GATEWAY: ghcr.io/${{ github.repository_owner }}/cheers-gateway
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/cheers-frontend

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      gateway: ${{ steps.plan.outputs.gateway }}
      frontend: ${{ steps.plan.outputs.frontend }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Plan changed images
        id: plan
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          FORCE_ALL: ${{ github.ref_type == 'tag' }}
        run: |
          args=(
            plan
            --workflow cd
            --base "$BASE_SHA"
            --head "$HEAD_SHA"
            --github-output "$GITHUB_OUTPUT"
            --summary "$GITHUB_STEP_SUMMARY"
          )
          if [ "$FORCE_ALL" = "true" ]; then args+=(--force-all); fi
          python3 scripts/ci_tool.py "${args[@]}"

  # ─────────────────────────────────────────────
  # Build & push Docker images
  # ─────────────────────────────────────────────
  build-gateway:
    name: Build Gateway Image
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.gateway == 'true' || github.ref_type == 'tag'
    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_GATEWAY }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push gateway
        id: build
        uses: docker/build-push-action@v6
        with:
          # Repo-root context: the gateway build needs the shared
          # bridge-protocol crate under packages/ (path dependency).
          context: .
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=gateway-image
          cache-to: type=gha,mode=max,scope=gateway-image

  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.ref_type == 'tag'
    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_FRONTEND }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push frontend
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend-image
          cache-to: type=gha,mode=max,scope=frontend-image

  # ─────────────────────────────────────────────
  # Deploy to the production server (Hetzner) via SSH.
  # The deploy key is a forced-command key on the server: any connection with it
  # runs /opt/cheers/deploy.sh (sync the allowlisted auth environment from
  # stdin, pull :main images, recreate gateway+frontend, then wait for health)
  # and nothing else. Gate: vars.DEPLOY_ENABLED = 'true'.
  # Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS,
  # APPLE_PRIVATE_KEY_P8. Public Apple identifiers and callback URLs are vars.
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [changes, build-gateway, build-frontend]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_ENABLED == 'true' &&
      (needs.build-gateway.result == 'success' || needs.build-frontend.result == 'success') &&
      needs.build-gateway.result != 'failure' &&
      needs.build-frontend.result != 'failure'
    environment: production

    steps:
      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ vars.APPLE_KEY_ID }}
          APPLE_CLIENT_ID: ${{ vars.APPLE_CLIENT_ID }}
          APPLE_PRIVATE_KEY_P8: ${{ secrets.APPLE_PRIVATE_KEY_P8 }}
          APPLE_WEB_CLIENT_ID: ${{ vars.APPLE_WEB_CLIENT_ID }}
          APPLE_WEB_REDIRECT_URI: ${{ vars.APPLE_WEB_REDIRECT_URI }}
          GATEWAY_IMAGE: ${{ env.IMAGE_GATEWAY }}:main
          FRONTEND_IMAGE: ${{ env.IMAGE_FRONTEND }}:main
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_SECRET: ${{ secrets.GOOGLE_WEB_CLIENT_SECRET }}
          GOOGLE_WEB_REDIRECT_URI: ${{ vars.GOOGLE_WEB_REDIRECT_URI }}
          GITHUB_OAUTH_CLIENT_ID: ${{ vars.CHEERS_GITHUB_OAUTH_CLIENT_ID }}
          GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.CHEERS_GITHUB_OAUTH_CLIENT_SECRET }}
          GITHUB_OAUTH_REDIRECT_URI: ${{ vars.CHEERS_GITHUB_OAUTH_REDIRECT_URI }}
          GITHUB_APP_ID: ${{ vars.CHEERS_GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.CHEERS_GITHUB_APP_PRIVATE_KEY }}
          GITHUB_AUTH_SYNC_ENABLED: ${{ vars.CHEERS_GITHUB_AUTH_SYNC_ENABLED }}
          OAUTH_WEB_RETURN_URL: ${{ vars.OAUTH_WEB_RETURN_URL }}
        run: |
          set +x
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

          for name in \
            APPLE_TEAM_ID \
            APPLE_KEY_ID \
            APPLE_CLIENT_ID \
            APPLE_PRIVATE_KEY_P8 \
            APPLE_WEB_CLIENT_ID \
            APPLE_WEB_REDIRECT_URI \
            OAUTH_WEB_RETURN_URL
          do
            if [ -z "${!name:-}" ]; then
              echo "required production auth setting is missing: $name" >&2
              exit 1
            fi
          done

          google_count=0
          for name in GOOGLE_WEB_CLIENT_ID GOOGLE_WEB_CLIENT_SECRET GOOGLE_WEB_REDIRECT_URI; do
            if [ -n "${!name:-}" ]; then
              google_count=$((google_count + 1))
            fi
          done
          if [ "$google_count" -ne 0 ] && [ "$google_count" -ne 3 ]; then
            echo "Google OAuth settings must be configured together" >&2
            exit 1
          fi

          github_oauth_count=0
          github_app_count=0
          if [ "$GITHUB_AUTH_SYNC_ENABLED" = "true" ]; then
            for name in GITHUB_OAUTH_CLIENT_ID GITHUB_OAUTH_CLIENT_SECRET GITHUB_OAUTH_REDIRECT_URI; do
              if [ -n "${!name:-}" ]; then github_oauth_count=$((github_oauth_count + 1)); fi
            done
            if [ "$github_oauth_count" -ne 0 ] && [ "$github_oauth_count" -ne 3 ]; then
              echo "GitHub OAuth settings must be configured together" >&2; exit 1
            fi
            for name in GITHUB_APP_ID GITHUB_APP_PRIVATE_KEY; do
              if [ -n "${!name:-}" ]; then github_app_count=$((github_app_count + 1)); fi
            done
            if [ "$github_app_count" -ne 0 ] && [ "$github_app_count" -ne 2 ]; then
              echo "GitHub App settings must be configured together" >&2; exit 1
            fi
          fi

          payload="$(mktemp)"
          trap 'rm -f "$payload"' EXIT
          chmod 600 "$payload"
          printf '%s\n' 'CHEERS_DEPLOY_AUTH_ENV_V1' > "$payload"

          append_payload_field() {
            name="$1"
            value="$2"
            encoded="$(printf '%s' "$value" | base64 | tr -d '\n')"
            printf '%s=%s\n' "$name" "$encoded" >> "$payload"
          }

          append_payload_field APPLE_TEAM_ID "$APPLE_TEAM_ID"
          append_payload_field APPLE_KEY_ID "$APPLE_KEY_ID"
          append_payload_field APPLE_CLIENT_ID "$APPLE_CLIENT_ID"
          append_payload_field APPLE_PRIVATE_KEY_P8 "$APPLE_PRIVATE_KEY_P8"
          append_payload_field APPLE_WEB_CLIENT_ID "$APPLE_WEB_CLIENT_ID"
          append_payload_field APPLE_WEB_REDIRECT_URI "$APPLE_WEB_REDIRECT_URI"
          append_payload_field GATEWAY_IMAGE "$GATEWAY_IMAGE"
          append_payload_field FRONTEND_IMAGE "$FRONTEND_IMAGE"
          if [ "$google_count" -eq 3 ]; then
            append_payload_field GOOGLE_WEB_CLIENT_ID "$GOOGLE_WEB_CLIENT_ID"
            append_payload_field GOOGLE_WEB_CLIENT_SECRET "$GOOGLE_WEB_CLIENT_SECRET"
            append_payload_field GOOGLE_WEB_REDIRECT_URI "$GOOGLE_WEB_REDIRECT_URI"
          fi
          if [ "$github_oauth_count" -eq 3 ]; then
            append_payload_field GITHUB_OAUTH_CLIENT_ID "$GITHUB_OAUTH_CLIENT_ID"
            append_payload_field GITHUB_OAUTH_CLIENT_SECRET "$GITHUB_OAUTH_CLIENT_SECRET"
            append_payload_field GITHUB_OAUTH_REDIRECT_URI "$GITHUB_OAUTH_REDIRECT_URI"
          fi
          if [ "$github_app_count" -eq 2 ]; then
            append_payload_field GITHUB_APP_ID "$GITHUB_APP_ID"
            append_payload_field GITHUB_APP_PRIVATE_KEY "$GITHUB_APP_PRIVATE_KEY"
          fi
          append_payload_field OAUTH_WEB_RETURN_URL "$OAUTH_WEB_RETURN_URL"

          # The server side ignores the requested command (forced command),
          # but pass "deploy" for readable auth logs. The fixed deploy script
          # accepts only the versioned, allowlisted payload on stdin.
          ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              "$USER@$HOST" deploy < "$payload"

      - name: Verify public health endpoint
        run: |
          for i in $(seq 1 10); do
            if curl -sf "https://${{ vars.APP_DOMAIN }}/health" >/dev/null; then
              echo "health ok"; exit 0
            fi
            sleep 3
          done
          echo "health endpoint not reachable" >&2; exit 1
