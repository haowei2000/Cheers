name: CI

on:
  push:
    # Feature branches are validated by pull_request. Running both push and PR
    # for the same SHA duplicated the complete iOS job (~7 minutes each).
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  # Cancel only older runs from the *same trigger stream*. A develop push and
  # its develop → main promotion PR are both required by branch protection;
  # grouping them together turns one required run into "cancelled", which
  # GitHub correctly refuses to merge.
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      gateway: ${{ steps.plan.outputs.gateway }}
      frontend: ${{ steps.plan.outputs.frontend }}
      plugin: ${{ steps.plan.outputs.plugin }}
      desktop: ${{ steps.plan.outputs.desktop }}
      ios: ${{ steps.plan.outputs.ios }}

    steps:
      - uses: actions/checkout@v5
        with:
          # The planner compares the exact push or pull-request revisions. Full
          # history avoids incorrect partial plans after multi-commit pushes.
          fetch-depth: 0

      - name: Test and audit CI/CD planner
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_ci_tool.py'
          python3 scripts/ci_tool.py audit

      - name: Plan affected checks
        id: plan
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          args=(
            plan
            --workflow ci
            --base "$BASE_SHA"
            --head "$HEAD_SHA"
            --github-output "$GITHUB_OUTPUT"
            --summary "$GITHUB_STEP_SUMMARY"
          )
          if [ "$IS_PULL_REQUEST" = "true" ]; then args+=(--merge-base); fi
          if [ "$FORCE_ALL" = "true" ]; then args+=(--force-all); fi
          python3 scripts/ci_tool.py "${args[@]}"

  # ─────────────────────────────────────────────
  # Gateway (Rust): fast contract check. This required status stays separate
  # for branch-protection compatibility, while compilation and every test run
  # once in the Postgres job below.
  # ─────────────────────────────────────────────
  gateway-check:
    name: Gateway Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.gateway == 'true' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # Fail in seconds before the compile-heavy test job completes.
      - name: Format
        run: cargo fmt --check

  # ─────────────────────────────────────────────
  # Gateway (Rust): compile once, then run unit + integration tests against a
  # real Postgres. Keeping this job name preserves existing required checks.
  # ─────────────────────────────────────────────
  gateway-integration:
    name: Gateway Integration (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.gateway == 'true' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cheers
          POSTGRES_PASSWORD: cheers
          POSTGRES_DB: cheers
        ports:
          - 5432:5432
        # Gate the job on the DB being reachable before any test connects.
        options: >-
          --health-cmd "pg_isready -U cheers"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # #[sqlx::test] connects here, then CREATEs/DROPs an isolated database per
      # test and auto-runs server/migrations. The URL comes from the environment
      # (never hard-coded in code) so parallel stacks can vary it freely.
      DATABASE_URL: postgres://cheers:cheers@localhost:5432/cheers

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      # One feature-enabled invocation compiles the gateway once and runs its
      # unit, doc, and Postgres-backed integration suites.
      - name: Unit and integration tests (real Postgres)
        run: cargo test --features integration

      # Known warnings remain informational, but reuse the artifacts above.
      - name: Clippy (non-blocking)
        run: cargo clippy --all-targets --features integration || true

  mcp-conformance:
    name: MCP 2026-07-28 Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.gateway == 'true' || needs.changes.outputs.plugin == 'true' || github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cheers
          POSTGRES_PASSWORD: cheers
          POSTGRES_DB: cheers_mcp_conformance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cheers"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://cheers:cheers@localhost:5432/cheers_mcp_conformance
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # The 2026-07-28 conformance CLI imports node:fs globSync, which is
          # unavailable in Node 20. Keep this job on the CLI's supported LTS.
          node-version: "24"
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Official server suite and host-bound OAuth path
        run: bash scripts/run-mcp-conformance.sh

  # ─────────────────────────────────────────────
  # Frontend: type-check + build
  # ─────────────────────────────────────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build and verify official extension catalog
        working-directory: .
        run: |
          npm --prefix packages/cheers-workbench-sdk ci
          npm --prefix packages/cheers-workbench-sdk test
          node --test scripts/lib/extension-catalog.test.mjs

      - name: Validate cross-platform item contract
        run: npm run design-system:check

      - name: Test design-system scanner
        run: npm run design-system:test

      - name: Lint
        run: npm run lint

      - name: Security checks
        run: npm run security:check

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The production image uses the repository root as its context so it can
      # include the authoritative policy pages from website/. A plain Vite build
      # cannot catch stale COPY paths between Docker stages.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=frontend-image
          cache-to: type=gha,mode=max,scope=frontend-image

  # ─────────────────────────────────────────────
  # Agent packages: Rust connector/MCP binaries
  # ─────────────────────────────────────────────
  plugin-build:
    name: Agent Package Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.plugin == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/cheers-acp-connector-rs
            packages/cheers-mcp-server

      - name: Format Rust agent packages
        run: |
          cargo fmt --manifest-path packages/cheers-acp-connector-rs/Cargo.toml -- --check
          cargo fmt --manifest-path packages/cheers-mcp-server/Cargo.toml -- --check

      # --workspace: the connector dir is a 2-member mini-workspace (binary +
      # the shared cheers-bridge-protocol crate the gateway also depends on).
      - name: Check Rust connector daemon
        run: cargo check --workspace --manifest-path packages/cheers-acp-connector-rs/Cargo.toml

      - name: Test Rust connector daemon
        run: cargo test --workspace --manifest-path packages/cheers-acp-connector-rs/Cargo.toml

      - name: Check Rust MCP server
        run: cargo check --manifest-path packages/cheers-mcp-server/Cargo.toml

  desktop-check:
    name: Desktop Check
    # macos-14: the Tauri crate needs Apple frameworks; no `tauri build` in CI
    # (slow, and unsigned artifacts aren't shippable anyway) — fmt + check only.
    runs-on: macos-14
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.desktop == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/macos/src-tauri

      - name: Format desktop shell
        run: cargo fmt --manifest-path apps/macos/src-tauri/Cargo.toml -- --check

      # tauri-build validates bundle resources (frontendDist, externalBin) at
      # build time — stub both so `cargo check` runs without a frontend build
      # or a release-compiled connector.
      - name: Stub bundle resources
        run: |
          mkdir -p frontend/dist apps/macos/src-tauri/binaries
          touch frontend/dist/index.html
          touch apps/macos/src-tauri/binaries/cce-acp-connector-aarch64-apple-darwin
          touch apps/macos/src-tauri/binaries/cce-acp-connector-x86_64-apple-darwin

      - name: Check desktop shell
        run: cargo check --manifest-path apps/macos/src-tauri/Cargo.toml

  # ─────────────────────────────────────────────
  # iOS (Swift): project-file sanity + a real compile.
  #
  # Added after a broken develop on 2026-07-20: two parallel branches gave
  # ChatModelStore.swift and WorkbenchSheet.swift the same hand-assigned
  # pbxproj ids, Xcode silently dropped one, and nothing in CI compiled iOS at
  # all — the app simply stopped building and no gate noticed.
  #
  # Simulator destination + CODE_SIGNING_ALLOWED=NO: this proves the code and
  # the project file are sound without needing signing certs or a provisioning
  # profile in CI. Device signing stays a local/release concern.
  # ─────────────────────────────────────────────
  ios-build:
    name: iOS Build
    # macos-15, not macos-14: the sources need Swift 6 (`@retroactive`, and the
    # SwiftUI MainActor-isolation inference that lets a View hold a @MainActor
    # model). macos-14 defaults to Xcode 15.4 / Swift 5.10 and fails on both.
    runs-on: macos-15
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.ios == 'true' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: apps/ios

    steps:
      - uses: actions/checkout@v5

      # Select the newest Xcode on the image rather than pinning a version: the
      # runner default lags well behind what the project is developed against,
      # and a hard-coded path breaks on the next image bump. The version is
      # printed so a future toolchain-drift failure is obvious in the log.
      - name: Select newest Xcode
        id: xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
          XCODE_CACHE_KEY="$(xcodebuild -version | paste -sd- - | tr ' /' '--')"
          echo "cache-key=$XCODE_CACHE_KEY" >> "$GITHUB_OUTPUT"

      # Cache package repositories and binary artifacts, not all of DerivedData.
      # A full DerivedData cache is large and can retain stale SDK/compiler state;
      # the explicit clone directory is stable across otherwise-ephemeral runners
      # and is invalidated by both Xcode and Package.resolved.
      - name: Cache SwiftPM packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cheers-swiftpm
          key: ios-spm-${{ runner.os }}-${{ steps.xcode.outputs.cache-key }}-${{ hashFiles('apps/ios/Cheers.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ios-spm-${{ runner.os }}-${{ steps.xcode.outputs.cache-key }}-

      # Runs first: when ids collide this names the two colliding files in a
      # second, where xcodebuild would instead fail minutes later pointing at
      # some unrelated file that referenced the dropped symbol.
      - name: Check project file
        run: python3 ../../scripts/check-pbxproj.py

      # Compile the Debug app and both test bundles once. The following test step
      # only launches those products instead of asking xcodebuild to plan/build a
      # second time for the concrete simulator destination.
      - name: Build for testing (iOS Simulator, unsigned)
        run: |
          xcodebuild \
            -project Cheers.xcodeproj \
            -scheme Cheers \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/cheers-ios-debug" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/cheers-swiftpm" \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing

      - name: Select available iPhone simulator
        id: ios-simulator
        run: |
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json, sys; data=json.load(sys.stdin); print(next(device["udid"] for devices in data["devices"].values() for device in devices if "iPhone" in device.get("deviceTypeIdentifier", "") and device.get("isAvailable", False)))')"
          test -n "$DEVICE_ID"
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Test (unit and accessibility UI)
        run: |
          xcodebuild \
            -project Cheers.xcodeproj \
            -scheme Cheers \
            -destination "id=${{ steps.ios-simulator.outputs.id }}" \
            -derivedDataPath "$RUNNER_TEMP/cheers-ios-debug" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/cheers-swiftpm" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 120 \
            CODE_SIGNING_ALLOWED=NO \
            test-without-building

      - name: Build (Release device, unsigned)
        # Feature PRs already verify the app and tests on the Simulator. The
        # costly device Release build runs after merge to develop/main and on
        # the develop → main promotion PR, where it is a release gate.
        if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        run: |
          xcodebuild \
            -project Cheers.xcodeproj \
            -scheme Cheers \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/cheers-ios-release" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/cheers-swiftpm" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Validate release metadata and privacy manifest
        if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
        run: |
          APP_INFO="$RUNNER_TEMP/cheers-ios-release/Build/Products/Release-iphoneos/Cheers.app/Info.plist"
          test "$(plutil -extract CFBundleIdentifier raw "$APP_INFO")" = "app.cheers.ios"
          test "$(plutil -extract CFBundleShortVersionString raw "$APP_INFO")" = "1.0.0"
          BUILD_NUMBER="$(plutil -extract CFBundleVersion raw "$APP_INFO")"
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          test -n "$(plutil -extract NSCameraUsageDescription raw "$APP_INFO")"
          test -n "$(plutil -extract NSMicrophoneUsageDescription raw "$APP_INFO")"
          test -n "$(plutil -extract NSSpeechRecognitionUsageDescription raw "$APP_INFO")"
          plutil -lint Sources/PrivacyInfo.xcprivacy
          plutil -convert json -o - Sources/PrivacyInfo.xcprivacy \
            | python3 -c 'import json, sys; values={item["NSPrivacyCollectedDataType"] for item in json.load(sys.stdin)["NSPrivacyCollectedDataTypes"]}; required={"NSPrivacyCollectedDataTypePhotosorVideos", "NSPrivacyCollectedDataTypeAudioData", "NSPrivacyCollectedDataTypeOtherUserContent"}; missing=required-values; assert not missing, f"missing privacy declarations: {sorted(missing)}"'
