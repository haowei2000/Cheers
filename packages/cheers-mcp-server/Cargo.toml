[package]
name = "cheers-mcp-server"
version = "0.1.2"
edition = "2021"
description = "Deprecated stdio compatibility bridge; use the Cheers remote HTTP MCP endpoint"

[[bin]]
name = "cheers-mcp-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
url = "2"
